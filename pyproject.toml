[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shukatsu-tracker"
version = "0.7.0"
description = "就活の選考状況をローカルで一元管理・分析するツール"
requires-python = ">=3.11"
dependencies = [
    # width="stretch" を st.dataframe と st.altair_chart に渡している。
    # st.dataframe は 1.49、st.altair_chart は 1.51 からこの引数を受け取る。
    "streamlit>=1.51",
    "pandas>=2.0",
    # app.py が直接 import する。streamlit の依存として入ってくるが、
    # 直接使うものは自分で宣言する（streamlit 側が外しても壊れないように）。
    "altair>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10"]
# 通信する評価先を使う場合だけ必要。既定の書き出しのみなら不要。
llm = ["anthropic>=1.0"]
# サーバー型の DB を使う場合だけ必要。既定の SQLite なら不要。
postgres = ["psycopg[binary]>=3.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shukatsu_tracker = ["db/migrations/*.sql", "review/criteria/*.toml", "review/criteria/industry/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
# 対象バージョンは固定しない（実行している Python に合わせる）。
# 3.11 に固定すると、numpy の型スタブが含む 3.12 以降の構文で検査が止まるため。
files = ["src", "app.py"]
# streamlit / pandas / psycopg は型スタブが揃っていないため、未解決の import は無視する
ignore_missing_imports = true
# 型注釈のない関数の中身も検査する（注釈漏れで検査が素通りしないように）
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# E/F: pycodestyle/pyflakes, I: import順, B: バグの温床, UP: 新しい構文への追従, SIM: 単純化
select = ["E", "F", "I", "B", "UP", "SIM"]
