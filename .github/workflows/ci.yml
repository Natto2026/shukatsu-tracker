name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# 既定の GITHUB_TOKEN は読み取りだけにする。CI はコミットもリリースもしない
permissions:
  contents: read

# 同じブランチへの連続 push で、古い実行を止めて最新だけを走らせる
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
      - run: pip install -e ".[dev]" -c constraints.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
      # SDK を入れて、実際の型に対して検査する（入れないと anthropic は Any 扱いになる）
      - run: pip install -e ".[dev,llm]" -c constraints.txt
      - run: python -m mypy

  test:
    name: test (SQLite, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
      # SDK も入れて、本物の SDK を通信だけ差し替えて通すテスト（TestWithTheRealSdk）を走らせる
      - run: pip install -e ".[dev,llm]" -c constraints.txt
      # 網羅率は記録として出すだけで、しきい値では落とさない
      - run: python -m pytest -v --cov

  test-postgres:
    # 同じテストを、実際の PostgreSQL に対しても走らせる。
    # 方言の差（プレースホルダ・主キー・日付関数・例外の型）が
    # 抜けていないことを、ここで検出する。
    name: test (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shukatsu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
      - run: pip install -e ".[dev,postgres]" -c constraints.txt
      # PostgreSQL の方言の分岐は SQLite のジョブでは通らない。ここでも網羅率を出す
      - run: python -m pytest -v --cov
        env:
          SHUKATSU_TEST_DSN: postgresql://postgres:postgres@127.0.0.1:5432/shukatsu_test
