# Web・ネット 向けの上乗せ観点。共通の観点（base.toml）に追加して使う。
# 特定の企業の評価基準ではなく、その業界の読み手が気にしやすい点の整理。

[meta]
name = "Web・ネット"
matches = "Web・ネット"
reader = """使う人の視点で考え、速く作って確かめ、数字で良し悪しを判断する姿勢を見られやすい。
完成度より、回した回数と学びの速さが評価されやすい。"""
emphasis = ["process_behind_result", "depth", "length"]

[[criteria]]
id = "user_view"
title = "使う人の視点"
check = """誰がどんな場面で困るのかを、具体的に捉えているか。
自分の想像ではなく、相手に聞いた・観察した形跡があるか。"""
weak = "課題の設定が作り手側の都合から始まっており、使う人の姿が見えない。"
weight = 3

[[criteria]]
id = "iteration"
title = "作って確かめたか"
check = """一度作って終わりではなく、反応を見て直した過程があるか。
何を見て良し悪しを判断したかが書かれているか。"""
weak = "作ったものの説明はあるが、公開後・利用後にどうだったかが書かれていない。"
weight = 2
