# メーカー 向けの上乗せ観点。共通の観点（base.toml）に追加して使う。
# 特定の企業の評価基準ではなく、その業界の読み手が気にしやすい点の整理。

[meta]
name = "メーカー"
matches = "メーカー"
reader = """試して直すことを繰り返し、ものを形にするまでやり切る姿勢を見られやすい。
うまくいかなかった原因をどこまで突き詰めたかが評価の分かれ目になる。"""
emphasis = ["cause_analysis", "process_behind_result", "difficulty"]

[[criteria]]
id = "persistence"
title = "やり切ったか"
check = """途中で方針を変えながらでも、最後まで形にしたことが書かれているか。
うまくいかなかった期間に何をしていたかが分かるか。"""
weak = "着手と結果はあるが、その間に何度試して何を直したのかが書かれていない。"
weight = 2

[[criteria]]
id = "root_cause"
title = "原因の突き止め方"
check = """不具合や停滞の原因を、推測で終わらせず確かめた過程があるか。
切り分けの手順が書かれていると、考え方が伝わる。"""
weak = "原因を1つ決め打ちして対策に進んでおり、確かめた形跡がない。"
weight = 2
