# 商社 向けの上乗せ観点。共通の観点（base.toml）に追加して使う。
# 特定の企業の評価基準ではなく、その業界の読み手が気にしやすい点の整理。

[meta]
name = "商社"
matches = "商社"
reader = """自ら動いて人を巻き込み、当事者として最後まで責任を持ったかを見られやすい。
組織の外に出て働きかけた経験が印象に残りやすい。"""
emphasis = ["role_and_action", "difficulty", "own_words"]

[[criteria]]
id = "initiative"
title = "自分から動いたか"
check = """指示されて動いたのではなく、自分で必要だと判断して動いた場面があるか。
動いた結果、周囲が変わったことが書かれているか。"""
weak = "役割を与えられてこなした話にとどまり、自分の意思で始めた部分が見えない。"
weight = 3

[[criteria]]
id = "outside_the_circle"
title = "外の相手を動かしたか"
check = """所属組織の外（他団体・企業・地域など）の相手と関わった経験があるか。
相手にとっての利点をどう示したかが書かれているか。"""
weak = "登場するのが身内だけで、利害の異なる外部との接点がない。"
weight = 2
