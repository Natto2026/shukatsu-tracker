# SIer・IT 向けの上乗せ観点。共通の観点（base.toml）に追加して使う。
# 特定の企業の評価基準ではなく、その業界の読み手が気にしやすい点の整理。

[meta]
name = "SIer・IT"
matches = "SIer・IT"
reader = """立場の異なる関係者の間に立ち、要望を整理して形にする仕事が中心になる。
そのため「技術的に何ができるか」よりも、「課題を構造化し、周囲を巻き込んで前に進めたか」
「専門外の相手に噛み砕いて説明できるか」を見られやすい。"""
emphasis = ["plain_language", "role_and_action", "cause_analysis", "answers_the_question"]

[[criteria]]
id = "stakeholders"
title = "立場の違う相手との調整"
check = """利害や前提が異なる相手と、どう合意をつくったかが書かれているか。
相手の制約を踏まえたうえで進め方を変えた場面があると伝わりやすい。"""
weak = "関係者が出てくるが、意見の食い違いや調整の中身が書かれていない。"
weight = 2

[[criteria]]
id = "quality_and_deadline"
title = "品質と期日への意識"
check = """決めた期日や品質をどう守ったかへの言及があるか。
うまくいかなかったときに、何を優先し何を落としたかが書かれているとなお良い。"""
weak = "作ったこと自体は書かれているが、期日・品質をどう扱ったかが見えない。"
weight = 1
