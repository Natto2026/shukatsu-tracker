# コンサル 向けの上乗せ観点。共通の観点（base.toml）に追加して使う。
# 特定の企業の評価基準ではなく、その業界の読み手が気にしやすい点の整理。

[meta]
name = "コンサル"
matches = "コンサル"
reader = """何が論点かを自分で設定し、仮説を立てて検証し、示唆まで持っていけるかを見られやすい。
文章そのものの構成力（結論から書けているか、無駄がないか）も評価対象になる。"""
emphasis = ["depth", "cause_analysis", "answers_the_question", "single_episode"]

[[criteria]]
id = "structure"
title = "結論から書けているか"
check = """最初の一文で答えが分かるか。そのあとの段落が、結論を支える順に並んでいるか。
読み返さないと関係が分からない箇所がないか。"""
weak = "背景から書き始めており、何の話か分かるまでに数文かかる。"
weight = 3

[[criteria]]
id = "so_what"
title = "示唆が出ているか"
check = """出来事の説明で終わらず、そこから何が言えるのかが書かれているか。
学びが一般論（「継続は力」等）で終わっていないか。"""
weak = "経験は詳しいが、最後の学びがどの経験にも当てはまる一般論になっている。"
weight = 2
