# 金融 向けの上乗せ観点。共通の観点（base.toml）に追加して使う。
# 特定の企業の評価基準ではなく、その業界の読み手が気にしやすい点の整理。

[meta]
name = "金融"
matches = "金融"
reader = """顧客の資産や社会の決済基盤を預かるため、正確さと慎重さが前提になる。
勢いのある行動より、根拠を確かめてから動いたか、誤りをどう防いだかを見られやすい。"""
emphasis = ["process_behind_result", "interview_ready", "cause_analysis", "not_an_impression"]

[[criteria]]
id = "evidence"
title = "数字と根拠の確かさ"
check = """挙げている数字に裏づけがあるか。出所の説明ができる書き方になっているか。
断定と推測が書き分けられているか。"""
weak = "印象的な数字はあるが、どう数えたのかが分からず、深掘りに耐えない。"
weight = 3

[[criteria]]
id = "prudence"
title = "慎重さと責任感"
check = """誤りやリスクに気づいて手を打った場面があるか。
確認を怠らなかったこと、他者への影響を考えた判断が書かれているか。"""
weak = "スピード感だけが強調され、確認や影響範囲への配慮が見えない。"
weight = 2
