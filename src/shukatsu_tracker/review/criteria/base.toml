# 応募業界を問わず共通で確認する観点。
# ここは一般的な「応募書類の書き方」の整理であり、特定の企業の評価基準ではない。
# 観点を足したい場合はこのファイルに [[criteria]] を追記する（コード変更は不要）。

[meta]
name = "共通の観点"
description = "応募書類の回答に、業界を問わず共通して求められる書き方の観点"

[[criteria]]
id = "answers_the_question"
title = "設問への正対"
check = """設問が明示的に求めている要素が、すべて回答に含まれているか。
たとえば「課題をどう分析し、どう行動したか、あなたの役割も交えて」であれば、
分析・行動・役割の3つが揃っていなければ、答えたことにならない。"""
weak = "設問の一部にしか答えていない。具体的ではあるが、聞かれた要素が抜けている。"
weight = 3

[[criteria]]
id = "premise"
title = "前提情報"
check = """何の研究か、何の活動か、どんな組織かが、初見の読み手に分かるか。
「研究成果が認められた」「バイトリーダーとして売上に貢献した」だけでは、
何の話か分からない。"""
weak = "所属・分野・規模といった最低限の前提が省かれている。"
weight = 2

[[criteria]]
id = "plain_language"
title = "専門外への翻訳"
check = """専門用語に、初見で意味が想像できる短い説明が添えられているか。
用語を並べること自体は具体性ではない。"""
weak = "専門用語が説明なしに並び、その分野の人にしか伝わらない。"
weight = 2

[[criteria]]
id = "cause_analysis"
title = "課題の分析"
check = """なぜその課題が生まれたのかが書かれているか。
課題を挙げてすぐ打ち手に飛んでいないか。原因を1つ置いて即解決に進む
単線の説明になっていないか。"""
weak = "課題と打ち手はあるが、その課題がなぜ生じたのかの分析がない。"
weight = 3

[[criteria]]
id = "role_and_action"
title = "自分の行動と役割"
check = """チームの成果ではなく、書き手自身が何をしたかが見えるか。
複数人で取り組んだ話なら、その中での自分の立ち位置が分かるか。"""
weak = "状況と結果は書かれているが、主語がチームのままで本人の行動が見えない。"
weight = 3

[[criteria]]
id = "process_behind_result"
title = "成果に至る過程"
check = """なぜその結果が得られたのかが書かれているか。
具体的にどんな工夫をしたのかが、結果と結びついているか。"""
weak = "結果の数字はあるが、そこへ至る取り組みが書かれていない。"
weight = 2

[[criteria]]
id = "difficulty"
title = "困難・葛藤"
check = """書き手が実際に困った場面が最低1つ入っているか。
板挟み、外部からの指摘、想定が崩れた場面、伝わらなかった場面などが該当する。"""
weak = "課題発見から成功まで一度もつまずかない完璧な筋書きになっており、個人の葛藤が見えない。"
weight = 3

[[criteria]]
id = "depth"
title = "なぜの深さ"
check = """「なぜそう考えたのか」が2段以上掘れているか。
検討したうえで捨てた選択肢が書かれていると、判断の理由が伝わる。
書き手の価値観の芯（なぜそれを頑張れたのか）まで届いているか。"""
weak = "行動は書かれているが、その行動を選んだ理由が1段で止まっている。"
weight = 2

[[criteria]]
id = "not_an_impression"
title = "感想文になっていないか"
check = """「良かったです」「頑張りました」で終わらず、
第三者が見ても評価できる取り組みと結果として書かれているか。"""
weak = "主観的な感想で締めており、何を達成したのかが客観的に読み取れない。"
weight = 2

[[criteria]]
id = "single_episode"
title = "1設問1エピソード"
check = """1つの回答に複数の経験を詰め込んでいないか。
設問が明示的に複数を求めている場合を除き、1つを深く書くほうが記憶に残る。"""
weak = "「活かせる経験は3つある。第一に…第二に…」という実績の羅列になっており、どれも掘り下がっていない。"
weight = 2

[[criteria]]
id = "length"
title = "字数の使い切り"
check = "文字数制限に対して8割以上を使えているか。逆に超過していないか。"
weak = "制限の半分程度で終わっており、伝えられる情報量を使い切れていない。"
weight = 1

[[criteria]]
id = "own_words"
title = "借り物の言葉になっていないか"
check = """「強く惹かれた」「価値創出」「一気通貫」のような、
どの応募先にも当てはまる定型句に寄りかかっていないか。
自作の抽象ラベル（「◯◯力」）を結論に置いて、中身の説明を省いていないか。"""
weak = "定型句が3つ以上あり、書き手本人の言葉になっていない。"
weight = 2

[[criteria]]
id = "interview_ready"
title = "深掘りに耐えるか"
check = """書かれている内容を、面接で細部まで口頭で説明できそうか。
数字や固有名詞に、裏づけを求められたら答えられない記述が混ざっていないか。"""
weak = "記述が抽象的で、深掘りされると答えに詰まりそうな箇所がある。"
weight = 2
